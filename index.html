<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나는 어떤 바이브코더일까? | 바이브코딩 1기 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F0FF; --card:#FFFFFF; --ink:#18214A; --soft:#5E6788; --line:#D8E0F5;
  --blue:#3752F5; --blue-tint:#E4E9FF; --yellow:#FFD84D; --ok:#12A373; --no:#E5484D; --on-blue:#FFFFFF;
  --round:"Jua","Gothic A1",system-ui,sans-serif;
  --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10142A; --card:#1B2140; --ink:#EEF1FF; --soft:#A3ABCB; --line:#2E3660;
    --blue:#7D8FFF; --blue-tint:#262E5C; --yellow:#FFD84D; --ok:#3DD39B; --no:#FF7478; --on-blue:#10142A;
  }
}
:root[data-theme="dark"]{
  --bg:#10142A; --card:#1B2140; --ink:#EEF1FF; --soft:#A3ABCB; --line:#2E3660;
  --blue:#7D8FFF; --blue-tint:#262E5C; --yellow:#FFD84D; --ok:#3DD39B; --no:#FF7478; --on-blue:#10142A;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 18px 40px;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.enter{animation:enter .35s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.enter-back{animation:enterBack .35s cubic-bezier(.2,.8,.3,1)}
@keyframes enterBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* 시작 */
.start{justify-content:center;text-align:center;gap:10px}
.badge{align-self:center;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:700}
.start h1{margin:18px 0 0;font-family:var(--round);font-weight:400;font-size:clamp(2.4rem,11vw,3.3rem);line-height:1.15;letter-spacing:-.01em}
.start h1 span{display:inline-block;background:var(--yellow);color:#18214A;padding:0 10px;border-radius:10px;transform:rotate(-2deg)}
.start .lead{margin:14px auto 0;max-width:22em;color:var(--soft);line-height:1.65;word-break:keep-all}
.hero-emoji{font-size:5.5rem;line-height:1;margin:26px 0 8px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.facts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 26px}
.facts span{background:var(--card);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:700;border:1px solid var(--line)}
.btn{appearance:none;border:0;border-radius:16px;padding:18px 20px;font-family:var(--round);font-size:1.25rem;cursor:pointer;background:var(--blue);color:var(--on-blue);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.resume{margin-top:12px;background:none;border:0;color:var(--soft);font-weight:700;text-decoration:underline;cursor:pointer;padding:8px}

/* 자기소개 */
.intro{justify-content:center;gap:8px}
.intro h2{margin:14px 0 0;font-family:var(--round);font-weight:400;font-size:clamp(1.7rem,7vw,2.1rem);line-height:1.3;word-break:keep-all}
.intro .lead{margin:8px auto 0;max-width:22em;color:var(--soft);line-height:1.6;word-break:keep-all}
.field{text-align:left;margin-top:18px}
.field label{display:block;font-weight:700;font-size:.88rem;margin-bottom:8px}
.field input,.field textarea{width:100%;appearance:none;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:1rem;background:var(--card);color:var(--ink);resize:none}
.field input:focus-visible,.field textarea:focus-visible{border-color:var(--blue)}
.field .cnt{display:block;text-align:right;font-size:.78rem;color:var(--soft);margin-top:6px}
.intro .btn:disabled{opacity:.45;cursor:default}
.intro .btn:disabled:active{transform:none;box-shadow:0 5px 0 var(--ink)}

/* 문항 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.back{appearance:none;border:0;background:var(--card);border:1.5px solid var(--line);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.back:disabled{opacity:.35;cursor:default}
.progress{flex:1;height:12px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .35s ease}
.count{font-family:var(--round);font-size:1.05rem;min-width:52px;text-align:right}
.qcard{margin-top:22px}
.week-pill{display:inline-block;background:var(--ink);color:var(--bg);font-size:.78rem;font-weight:800;padding:5px 10px;border-radius:8px}
.topic{margin-left:6px;font-size:.82rem;color:var(--soft);font-weight:700}
.qnum{margin:22px 0 0;font-family:var(--round);font-size:2.6rem;color:var(--blue);line-height:1}
.qtext{margin:10px 0 0;font-family:var(--round);font-weight:400;font-size:clamp(1.35rem,5.6vw,1.6rem);line-height:1.45;word-break:keep-all;min-height:3em}
.answers{display:grid;gap:10px;margin-top:26px}
.ans{appearance:none;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:15px 16px;cursor:pointer;font-size:1rem;line-height:1.55;font-weight:500;word-break:keep-all;transition:border-color .12s,background .12s,transform .12s}
.ans:hover{border-color:var(--blue)}
.ans .k{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--blue-tint);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-family:var(--round);font-size:1rem;margin-top:-1px}
.ans.picked{border-color:var(--blue);background:var(--blue-tint);transform:scale(.985)}
.ans.picked .k{background:var(--blue);color:var(--on-blue)}
.hint{margin:auto 0 0;padding-top:24px;text-align:center;font-size:.82rem;color:var(--soft)}

/* 로딩 */
.loading{justify-content:center;align-items:center;text-align:center;gap:18px}
.dots{display:flex;gap:10px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--blue);animation:hop 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--yellow)}
.dots i:nth-child(3){animation-delay:.3s;background:var(--ink)}
@keyframes hop{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
.loading p{font-family:var(--round);font-size:1.3rem;margin:0}

/* 결과 */
.rcard{background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:28px 22px 24px;text-align:center;box-shadow:0 8px 0 var(--ink)}
.rname{margin:0 0 8px;font-family:var(--round);font-weight:400;font-size:clamp(1.4rem,6.2vw,1.75rem);line-height:1.35;word-break:keep-all}
.rlabel{margin:0;font-weight:700;color:var(--soft);font-size:.9rem}
.remoji{font-size:5rem;line-height:1;margin:16px 0 10px}
.rtype{margin:0;font-family:var(--round);font-weight:400;font-size:clamp(1.8rem,8vw,2.2rem);line-height:1.25;word-break:keep-all}
.rsub{margin:10px auto 0;max-width:22em;color:var(--soft);line-height:1.6;word-break:keep-all}
.score{display:inline-flex;align-items:baseline;gap:4px;margin-top:18px;background:var(--yellow);color:#18214A;border-radius:14px;padding:8px 16px;font-family:var(--round)}
.score b{font-size:2.2rem;font-weight:400;line-height:1}
.score span{font-size:1rem}
.section{margin-top:22px;background:var(--card);border-radius:20px;padding:20px;border:1.5px solid var(--line)}
.section h3{margin:0 0 14px;font-family:var(--round);font-weight:400;font-size:1.2rem}
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:10px}
.gauge .g-name{font-weight:800;font-size:.9rem;min-width:46px}
.gauge .g-bar{height:14px;background:var(--blue-tint);border-radius:999px;overflow:hidden}
.gauge .g-bar i{display:block;height:100%;background:var(--blue);border-radius:999px;width:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.gauge .g-num{font-family:var(--round);font-size:1rem;min-width:34px;text-align:right}
.g-title{font-size:.78rem;color:var(--soft);grid-column:2 / 4;margin-top:-6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two div{background:var(--blue-tint);border-radius:14px;padding:14px;font-size:.9rem;line-height:1.55;word-break:keep-all;text-align:left}
.two b{display:block;font-family:var(--round);font-weight:400;font-size:1.02rem;margin-bottom:4px}
.review{display:grid;gap:8px}
.rv{border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.rv summary{list-style:none;cursor:pointer;padding:14px;display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:.92rem;line-height:1.5;word-break:keep-all}
.rv summary::-webkit-details-marker{display:none}
.rv .mk{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:800}
.rv.ok .mk{background:var(--ok)}
.rv.no .mk{background:var(--no)}
.rv .body{padding:0 14px 14px 48px;font-size:.9rem;line-height:1.65;word-break:keep-all}
.rv .line{margin:0 0 4px}
.rv .line.mine{color:var(--no)}
.rv .line.right{color:var(--ok);font-weight:700}
.rv .exp{margin:8px 0 0;color:var(--soft)}
.filter{display:flex;gap:6px;margin-bottom:12px}
.filter button{appearance:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:grid;gap:12px;margin-top:26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">

  <section class="screen start" id="s-start">
    <span class="badge">바이브코딩 1기 1~3주차</span>
    <div class="hero-emoji" aria-hidden="true">🧑‍💻</div>
    <h1>나는 어떤<br><span>바이브코더</span>일까?</h1>
    <p class="lead">3주 동안 배운 내용으로 20문제를 풀면, 지금 나의 바이브코딩 유형과 다시 볼 부분을 알려드려요.</p>
    <div class="facts"><span>20문제</span><span>약 5분</span><span>해설 포함</span></div>
    <button class="btn" id="startBtn" type="button">테스트 시작하기</button>
    <button class="resume" id="resumeBtn" type="button" hidden>이어서 풀기</button>
  </section>

  <section class="screen intro" id="s-intro" hidden>
    <h2>시작하기 전에<br>먼저 알려주세요</h2>
    <p class="lead">결과에 이름을 붙여서 보여드려요.</p>
    <form id="introForm">
      <div class="field">
        <label for="nameInput">이름/닉네임 <span aria-hidden="true">*</span></label>
        <input type="text" id="nameInput" name="name" maxlength="20" placeholder="예: 홍길동" autocomplete="off" required>
        <span class="cnt" id="nameCnt">0/20</span>
      </div>
      <div class="field">
        <label for="introInput">한 줄 자기소개 (선택)</label>
        <textarea id="introInput" name="intro" maxlength="60" rows="2" placeholder="예: 마케터인데 자동화에 관심 많아요"></textarea>
        <span class="cnt" id="introCnt">0/60</span>
      </div>
      <button class="btn" type="submit" id="introStartBtn" disabled style="margin-top:22px">테스트 시작하기</button>
      <button class="resume" id="introBackBtn" type="button">뒤로가기</button>
    </form>
  </section>

  <section class="screen" id="s-quiz" hidden>
    <div class="top">
      <button class="back" id="backBtn" type="button" aria-label="이전 문제">‹</button>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="20" id="pbar"><i id="pfill"></i></div>
      <span class="count" id="count">1/20</span>
    </div>
    <div class="qcard" id="qcard"></div>
    <p class="hint">답을 고르면 다음 문제로 넘어가요</p>
  </section>

  <section class="screen loading" id="s-loading" hidden>
    <div class="dots"><i></i><i></i><i></i></div>
    <p>결과를 분석하고 있어요</p>
  </section>

  <section class="screen" id="s-result" hidden></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const WEEKS = {1:"AI와 대화하며 첫 서비스 만들기", 2:"수정 지옥에서 벗어나는 한마디", 3:"내 프로젝트를 진짜 서비스로"};
const Q = [
  {w:1,t:"바이브코딩 원리",q:"바이브코딩을 가장 정확하게 설명한 것은?",
   o:["코드 문법을 먼저 외운 뒤, AI에게는 검사만 맡기는 방식","만들고 싶은 것을 말로 설명하면 AI가 코드를 쓰고, 나는 결과를 보며 방향을 다시 잡아주는 방식","이미 완성된 템플릿을 사서 이름과 색만 바꾸는 방식","개발자에게 외주를 맡기고 완성본만 받아보는 방식"],a:1,
   ex:"나는 ‘무엇을, 왜’ 만드는지 말하고, AI가 ‘어떻게’를 코드로 옮깁니다. 결과를 보고 다시 말로 고치는 대화의 반복이 바이브코딩의 핵심이에요."},
  {w:1,t:"음성 입력 도구",q:"1주차에 무료 음성 입력 도구를 설치한 가장 큰 이유는?",
   o:["음성으로 요청해야 AI가 코드를 더 빨리 만들어서","키보드로 입력하면 AI가 잘 못 알아들어서","말로 하면 타이핑보다 훨씬 길고 구체적으로 설명하게 되어, AI가 의도를 정확히 이해하기 때문에","음성 입력을 써야 Claude를 무료로 쓸 수 있어서"],a:2,
   ex:"타이핑은 귀찮아서 짧게 쓰게 되지만, 말은 상황과 이유까지 자연스럽게 붙어요. AI에게는 설명이 구체적일수록 결과가 좋아집니다."},
  {w:1,t:"잘 만든 서비스 따라 만들기",q:"‘잘 만든 서비스 따라 만들기’ 실습의 진짜 목적은?",
   o:["똑같이 만들어서 바로 출시하기 위해","디자인 저작권 규칙을 배우기 위해","경쟁사 분석 보고서를 쓰기 위해","이미 검증된 화면 구성과 흐름을 보면서, 원하는 것을 AI에게 구체적으로 말하는 연습을 하기 위해"],a:3,
   ex:"좋은 서비스는 ‘무엇을 어디에 둘지’가 이미 정리돼 있어요. 그걸 말로 설명해 보는 과정에서 AI에게 요청하는 어휘와 감각이 생깁니다."},
  {w:1,t:"AI용 PRD 작성법",q:"PRD에 대한 설명으로 가장 알맞은 것은?",
   o:["완성된 코드를 모아 두는 파일","누구를 위해, 어떤 문제를, 어떤 기능으로 해결하는지 정리한 기획 문서로, AI에게 건네는 설계도","투자자에게 보여주는 재무 계획서","서비스를 다 만든 뒤에 쓰는 사용 설명서"],a:1,
   ex:"PRD는 만들기 전에 쓰는 문서예요. 대상 사용자, 해결할 문제, 핵심 기능, 화면 흐름을 적어 두면 AI가 매번 같은 방향으로 만들어 줍니다."},
  {w:1,t:"아이디어를 기능으로",q:"다음 중 AI가 가장 정확하게 만들어 줄 수 있는 요청은?",
   o:["“좋은 가계부 앱 하나 만들어줘”","“요즘 유행하는 앱처럼 세련되게 만들어줘”","“지출을 날짜, 금액, 분류로 입력하고, 이번 달 분류별 합계를 원그래프로 보여주는 화면을 만들어줘”","“사람들이 좋아할 만한 기능을 알아서 넣어줘”"],a:2,
   ex:"아이디어를 ‘입력하는 것, 보여주는 것, 계산하는 것’처럼 구체적인 기능으로 쪼개면 AI가 추측해야 할 부분이 줄어들어요."},
  {w:1,t:"KPT 회고",q:"KPT 회고의 세 글자가 뜻하는 것은?",
   o:["Keep(계속할 것), Problem(문제였던 것), Try(다음에 시도할 것)","Key(핵심), Plan(계획), Test(검증)","Knowledge(지식), Practice(연습), Teach(가르치기)","Keep(유지), Push(밀어붙이기), Tell(공유)"],a:0,
   ex:"잘된 것은 유지하고, 문제는 적어 두고, 다음에 해볼 것을 정합니다. 매주 이렇게 정리하면 같은 실수를 반복하지 않아요."},

const KEY = "vc1-mbti-v1";
let st = {answers:Array(Q.length).fill(null), idx:0, done:false, name:"", intro:"", submitted:false};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.answers) && s.answers.length === Q.length) st = s; } catch(e){}
st.name = typeof st.name === "string" ? st.name : "";
st.intro = typeof st.intro === "string" ? st.intro : "";
st.submitted = !!st.submitted;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
const $ = id => document.getElementById(id);
let locked = false;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function show(id){
  ["s-start","s-intro","s-quiz","s-loading","s-result"].forEach(s => $(s).hidden = s !== id);
  window.scrollTo({top:0});
}

function renderQ(dir){
  const i = st.idx, q = Q[i];
  $("count").textContent = `${i+1}/${Q.length}`;
  $("pfill").style.width = (i / Q.length * 100) + "%";
  $("pbar").setAttribute("aria-valuenow", i);
  $("backBtn").disabled = i === 0;
  const c = $("qcard");
  c.innerHTML = `<span class="week-pill">${q.w}주차</span><span class="topic">${q.t}</span>
    <p class="qnum">Q${i+1}.</p>
    <h2 class="qtext" id="qh">${q.q}</h2>
    <div class="answers" role="group" aria-labelledby="qh">
      ${q.o.map((o,j)=>`<button type="button" class="ans${st.answers[i]===j?" picked":""}" data-o="${j}"><span class="k">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}
    </div>`;
  c.classList.remove("enter","enter-back"); void c.offsetWidth;
  c.classList.add(dir < 0 ? "enter-back" : "enter");
  locked = false;
}

$("qcard").addEventListener("click", e => {
  const b = e.target.closest(".ans"); if (!b || locked) return;
  locked = true;
  st.answers[st.idx] = +b.dataset.o;
  b.parentElement.querySelectorAll(".ans").forEach(x => x.classList.toggle("picked", x === b));
  save();
  setTimeout(() => {
    if (st.idx < Q.length - 1){ st.idx++; save(); renderQ(1); }
    else finish();
  }, 280);
});

$("backBtn").addEventListener("click", () => { if (st.idx > 0){ st.idx--; save(); renderQ(-1); } });

function finish(){
  $("pfill").style.width = "100%";
  st.done = true; save();
  show("s-loading");
  setTimeout(renderResult, 1500);
}

function calc(){
  const wk = [1,2,3].map(w => {
    const idx = Q.map((_,i)=>i).filter(i => Q[i].w === w);
    const c = idx.filter(i => st.answers[i] === Q[i].a).length;
    return {w, c, n:idx.length, r:c/idx.length};
  });
  const correct = Q.filter((q,i) => st.answers[i] === q.a).length;
  const score = correct * 5;
  let type;
  if (score >= 95) type = "top";
  else if (score < 50) type = "seed";
  else {
    const min = Math.min(...wk.map(x => x.r));
    type = "w" + wk.filter(x => x.r === min).sort((a,b) => b.w - a.w)[0].w;
  }
  return {wk, correct, score, type};
}

  renderReview();
  $("s-result").querySelectorAll(".filter button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; renderReview(); }));
  $("retryBtn").addEventListener("click", retry);
  $("shareBtn").addEventListener("click", share);
  if (!st.submitted) submitResult(r);
}

function submitResult(r){
  st.submitted = true; save();
  try {
    fetch("/api/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        name: st.name || "",
        intro: st.intro || "",
        score: r.score,
        total: Q.length,
        type: r.type,
        weekly: r.wk.map(x => ({w:x.w, c:x.c, n:x.n}))
      })
    }).catch(() => {});
  } catch(e){}
}

function renderReview(){
  document.querySelectorAll(".filter button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter ? "true" : "false"));
  const list = Q.map((q,i) => ({q,i,ok: st.answers[i] === q.a})).filter(x => filter === "all" || !x.ok);
  $("review").innerHTML = list.length ? list.map(({q,i,ok}) => `
    <details class="rv ${ok?"ok":"no"}">
      <summary><span class="mk" aria-label="${ok?"정답":"오답"}">${ok?"O":"X"}</span><span>Q${i+1}. ${q.q}</span></summary>
      <div class="body">
        ${!ok && st.answers[i] !== null ? `<p class="line mine">내 답: ${"ABCD"[st.answers[i]]}. ${q.o[st.answers[i]]}</p>` : ""}
        <p class="line right">정답: ${"ABCD"[q.a]}. ${q.o[q.a]}</p>
        <p class="exp">${q.ex}</p>
      </div>
    </details>`).join("") : `<p style="margin:0;color:var(--soft)">틀린 문제가 없어요. 전체 보기로 해설을 훑어볼 수 있어요.</p>`;
}

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
async function share(){
  const r = calc();
  const text = `나의 바이브코딩 유형: ${TYPES[r.type].name} (${r.score}점)\n${location.href}`;
  try { await navigator.clipboard.writeText(text); toast("결과를 복사했어요"); }
  catch(e){ toast("복사가 막혀 있어요. 주소창의 링크를 공유해 주세요"); }
}

function restart(){
  st = {answers:Array(Q.length).fill(null), idx:0, done:false, name:st.name, intro:st.intro, submitted:false}; save();
  show("s-quiz"); renderQ(1);
}

function retry(){
  showIntro();
}

function showIntro(){
  $("nameInput").value = st.name || "";
  $("introInput").value = st.intro || "";
  $("nameCnt").textContent = `${$("nameInput").value.length}/20`;
  $("introCnt").textContent = `${$("introInput").value.length}/60`;
  $("introStartBtn").disabled = !$("nameInput").value.trim();
  show("s-intro");
}

$("nameInput").addEventListener("input", () => {
  $("nameCnt").textContent = `${$("nameInput").value.length}/20`;
  $("introStartBtn").disabled = !$("nameInput").value.trim();
});
$("introInput").addEventListener("input", () => {
  $("introCnt").textContent = `${$("introInput").value.length}/60`;
});
$("introForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("nameInput").value.trim().slice(0, 20);
  if (!name) return;
  st.name = name;
  st.intro = $("introInput").value.trim().slice(0, 60);
  save();
  restart();
});
$("introBackBtn").addEventListener("click", () => show("s-start"));

$("startBtn").addEventListener("click", showIntro);
$("resumeBtn").addEventListener("click", () => { show("s-quiz"); renderQ(1); });

if (st.done) renderResult();
else {
  if (st.answers.some(a => a !== null)) { $("resumeBtn").hidden = false; $("resumeBtn").textContent = `이어서 풀기 (Q${st.idx+1}부터)`; }
  show("s-start");
}
</script>
</body>
</html>
