<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>제출 결과 관리자 | 바이브코딩 1기 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F0FF; --card:#FFFFFF; --ink:#18214A; --soft:#5E6788; --line:#D8E0F5;
  --blue:#3752F5; --blue-tint:#E4E9FF; --yellow:#FFD84D; --ok:#12A373; --no:#E5484D; --on-blue:#FFFFFF;
  --round:"Jua","Gothic A1",system-ui,sans-serif;
  --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10142A; --card:#1B2140; --ink:#EEF1FF; --soft:#A3ABCB; --line:#2E3660;
    --blue:#7D8FFF; --blue-tint:#262E5C; --yellow:#FFD84D; --ok:#3DD39B; --no:#FF7478; --on-blue:#10142A;
  }
}
:root[data-theme="dark"]{
  --bg:#10142A; --card:#1B2140; --ink:#EEF1FF; --soft:#A3ABCB; --line:#2E3660;
  --blue:#7D8FFF; --blue-tint:#262E5C; --yellow:#FFD84D; --ok:#3DD39B; --no:#FF7478; --on-blue:#10142A;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:920px;margin:0 auto;min-height:100%;padding:28px 18px 50px}
h1{margin:0 0 4px;font-family:var(--round);font-weight:400;font-size:clamp(1.7rem,6vw,2.1rem)}
.sub{margin:0 0 22px;color:var(--soft);font-size:.92rem}

.card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:20px;box-shadow:0 6px 0 var(--ink)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field label{font-weight:700;font-size:.88rem}
.field input{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;background:var(--bg);color:var(--ink)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-family:var(--round);font-size:1.1rem;cursor:pointer;background:var(--blue);color:var(--on-blue);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--no);font-weight:700;font-size:.88rem;margin:0}
.hidden{display:none!important}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 16px}
.toolbar input[type="search"]{flex:1;min-width:180px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;background:var(--card);color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:var(--round);font-size:1.6rem;font-weight:400}
.stat span{font-size:.82rem;color:var(--soft)}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.9rem;word-break:keep-all}
th{background:var(--blue-tint);font-weight:800;font-size:.82rem}
tr:last-child td{border-bottom:none}

.cards{display:none;flex-direction:column;gap:10px}
.rcard2{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.rcard2 .row{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-top:6px}
.rcard2 .name{font-family:var(--round);font-size:1.1rem}
.rcard2 .meta{color:var(--soft);font-size:.8rem;margin-top:4px}

@media (max-width:640px){
  table{display:none}
  .cards{display:flex}
}

.empty{padding:24px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<div class="app">
  <h1>제출 결과 관리자</h1>
  <p class="sub">바이브코딩 1기 테스트 제출 현황을 확인해요.</p>

  <section class="card" id="loginCard">
    <div class="field">
      <label for="pwInput">관리자 비밀번호</label>
      <input type="password" id="pwInput" autocomplete="off">
    </div>
    <p class="err hidden" id="loginErr"></p>
    <button class="btn" type="button" id="loginBtn">로그인</button>
  </section>

  <section id="dashboard" class="hidden">
    <div class="stats">
      <div class="stat"><b id="statCount">0</b><span>전체 제출 수</span></div>
      <div class="stat"><b id="statAvg">0</b><span>평균 점수</span></div>
    </div>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="이름으로 검색">
      <button class="btn ghost" type="button" id="refreshBtn">새로고침</button>
      <button class="btn ghost" type="button" id="csvBtn">CSV 다운로드</button>
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead>
          <tr><th>이름</th><th>자기소개</th><th>점수</th><th>유형</th><th>제출 시각</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="cards" id="cardsList"></div>
    <p class="empty hidden" id="emptyMsg">표시할 결과가 없어요.</p>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PW_KEY = "vc1-admin-pw";
let allResults = [];

const TYPE_NAMES = {
  top:"바로 출시해도 되는 메이커", w1:"손이 먼저 가는 실행파", w2:"수정 지옥 탈출 중인 여행자",
  w3:"연결만 남은 화면 장인", seed:"이제 막 시동 건 새싹 빌더"
};

function fmtDate(iso){
  try {
    return new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
    }).format(new Date(iso));
  } catch(e){ return iso || ""; }
}

function getPw(){ try { return sessionStorage.getItem(PW_KEY) || ""; } catch(e){ return ""; } }
function setPw(v){ try { sessionStorage.setItem(PW_KEY, v); } catch(e){} }

async function fetchResults(pw){
  const res = await fetch("/api/results", { headers: { "x-admin-password": pw } });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(res.status === 401 ? "비밀번호가 올바르지 않아요" : (body.error || "불러오기에 실패했어요"));
  }
  const data = await res.json();
  return Array.isArray(data.results) ? data.results : [];
}

async function login(){
  const pw = $("pwInput").value;
  $("loginErr").classList.add("hidden");
  $("loginBtn").disabled = true;
  try {
    const results = await fetchResults(pw);
    setPw(pw);
    allResults = results;
    $("loginCard").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    render();
  } catch(e){
    $("loginErr").textContent = e.message;
    $("loginErr").classList.remove("hidden");
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function refresh(){
  const pw = getPw();
  if (!pw) return;
  try {
    allResults = await fetchResults(pw);
    render();
  } catch(e){
    $("loginCard").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    $("loginErr").textContent = e.message;
    $("loginErr").classList.remove("hidden");
  }
}

function filtered(){
  const q = $("searchInput").value.trim().toLowerCase();
  if (!q) return allResults;
  return allResults.filter(r => (r.name || "").toLowerCase().includes(q));
}

function render(){
  const list = filtered();
  const count = allResults.length;
  const avg = count ? (allResults.reduce((s,r) => s + (Number(r.score) || 0), 0) / count) : 0;
  $("statCount").textContent = count;
  $("statAvg").textContent = avg.toFixed(1);

  $("emptyMsg").classList.toggle("hidden", list.length > 0);

  $("tbody").innerHTML = list.map(r => `
    <tr>
      <td>${esc(r.name || "")}</td>
      <td>${esc(r.intro || "")}</td>
      <td>${esc(r.score)}${r.total ? " / " + esc(r.total) : ""}</td>
      <td>${esc(TYPE_NAMES[r.type] || r.type || "")}</td>
      <td>${esc(fmtDate(r.createdAt))}</td>
    </tr>`).join("");

  $("cardsList").innerHTML = list.map(r => `
    <div class="rcard2">
      <div class="name">${esc(r.name || "")}</div>
      <div class="row"><span>${esc(r.intro || "")}</span></div>
      <div class="row"><span>점수: ${esc(r.score)}${r.total ? " / " + esc(r.total) : ""}</span><span>${esc(TYPE_NAMES[r.type] || r.type || "")}</span></div>
      <div class="meta">${esc(fmtDate(r.createdAt))}</div>
    </div>`).join("");
}

function toCsvField(v){
  const s = String(v == null ? "" : v);
  return '"' + s.replace(/"/g, '""') + '"';
}

function downloadCsv(){
  const rows = [["이름","자기소개","점수","총점","유형","제출 시각"]];
  filtered().forEach(r => {
    rows.push([r.name || "", r.intro || "", r.score, r.total || "", TYPE_NAMES[r.type] || r.type || "", fmtDate(r.createdAt)]);
  });
  const csv = rows.map(row => row.map(toCsvField).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `vc1-results-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

$("loginBtn").addEventListener("click", login);
$("pwInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("refreshBtn").addEventListener("click", refresh);
$("searchInput").addEventListener("input", render);
$("csvBtn").addEventListener("click", downloadCsv);

const savedPw = getPw();
if (savedPw) {
  $("pwInput").value = savedPw;
  login();
}
</script>
</body>
</html>
